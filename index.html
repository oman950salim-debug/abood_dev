<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=IBM+Plex+Sans+Arabic:wght@500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: fire GIF full-screen, centered column — avatar, spaced name, tags, then stacked link rows. Monochrome glass, dark-only by design. */
:root {
  --night: #070707;
  --glass: rgba(255,255,255,.07);
  --glass-hi: rgba(255,255,255,.14);
  --line: rgba(255,255,255,.12);
  --text: #f2f2f2;
  --muted: rgba(242,242,242,.6);
  --sans: "Inter", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--text); font-family: var(--sans); overflow-x: hidden; }
.bg { position: fixed; inset: -20px; z-index: 0; background: url("bg.gif") center / cover no-repeat; filter: grayscale(.35) blur(1.5px) brightness(.7); }
.shade { position: fixed; inset: 0; z-index: 1; background: radial-gradient(ellipse at center, rgba(7,7,7,.15) 0%, rgba(7,7,7,.85) 100%); }

.stage {
  position: relative; z-index: 2;
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px;
}
.profile { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.avatar {
  width: 124px; height: 124px; border-radius: 50%;
  padding: 4px; background: rgba(255,255,255,.08);
  border: 2px solid rgba(255,255,255,.35);
  box-shadow: 0 0 40px rgba(255,255,255,.12);
}
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
h1 {
  margin: 8px 0 0; font-weight: 800; font-size: clamp(28px, 6vw, 36px);
  letter-spacing: .22em; padding-left: .22em; /* balance the trailing tracking */
  text-shadow: 0 2px 20px rgba(0,0,0,.6);
}
.rule { width: 40px; height: 1px; background: rgba(255,255,255,.4); }
.tags { margin: 0; color: var(--muted); font-weight: 600; font-size: 15px; letter-spacing: .02em; }

.links { width: min(456px, 100%); margin-top: 40px; display: flex; flex-direction: column; gap: 14px; }
.row {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 18px; min-height: 74px; box-sizing: border-box;
  border-radius: 10px; text-decoration: none; color: var(--text);
  background: linear-gradient(100deg, var(--glass-hi), var(--glass));
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  transition: transform .2s, background .2s, border-color .2s;
}
.row:hover, .row:focus-visible { transform: translateY(-2px); background: linear-gradient(100deg, rgba(255,255,255,.22), rgba(255,255,255,.1)); border-color: rgba(255,255,255,.3); outline: none; }
.ico { width: 42px; height: 42px; flex: none; border-radius: 9px; display: grid; place-items: center; background: rgba(0,0,0,.35); border: 1px solid var(--line); }
.ico svg { width: 22px; height: 22px; }
.label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.label b { font-weight: 600; font-size: 16px; }
.label small { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arrow { width: 18px; height: 18px; color: var(--muted); flex: none; transition: transform .2s; }
.row:hover .arrow { transform: translateX(3px); color: var(--text); }

.music {
  position: fixed; z-index: 3;
  right: calc(24px + env(safe-area-inset-right, 0px));
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: 50px; height: 50px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: rgba(0,0,0,.6); border: 1px solid var(--line); color: var(--text);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.music:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
.bars i { width: 3px; border-radius: 1px; background: currentColor; }
.bars i:nth-child(1) { height: 6px; } .bars i:nth-child(2) { height: 11px; } .bars i:nth-child(3) { height: 16px; }
.music.playing .bars i { animation: eq .9s ease-in-out infinite; }
.music.playing .bars i:nth-child(2) { animation-delay: .25s; }
.music.playing .bars i:nth-child(3) { animation-delay: .5s; }
.music:not(.playing) { opacity: .6; }
@keyframes eq { 50% { height: 4px; } }

.gate {
  position: fixed; inset: 0; z-index: 5; width: 100%; border: 0; cursor: pointer;
  display: grid; place-items: center;
  background: rgba(7,7,7,.8); color: var(--text);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-family: var(--sans); font-weight: 600; font-size: 15px; letter-spacing: .35em; text-transform: uppercase;
  transition: opacity .7s;
}
.gate span { animation: pulse 2.2s ease-in-out infinite; }
.gate.gone { opacity: 0; pointer-events: none; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .gate span, .music.playing .bars i { animation: none; } .row, .arrow { transition: none; } }
@media (max-width: 420px) { .row { padding: 14px; gap: 12px; } .links { margin-top: 32px; } }
</style>
</head>

<button class="music" id="music" type="button" aria-label="إيقاف الأغنية"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
<audio id="audio" src="song.mp3" loop preload="auto"></audio>

<script>
  const audio = document.getElementById("audio");
  const music = document.getElementById("music");
  const gate = document.getElementById("gate");
  audio.volume = 0.6;
  function sync() {
    const on = !audio.paused;
    music.classList.toggle("playing", on);
    music.setAttribute("aria-label", on ? "إيقاف الأغنية" : "تشغيل الأغنية");
  }
  gate.addEventListener("click", () => { gate.classList.add("gone"); audio.play().catch(() => {}); });
  music.addEventListener("click", () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); });
  audio.addEventListener("play", sync);
  audio.addEventListener("pause", sync);
</script>
